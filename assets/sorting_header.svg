<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b263b"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="900" height="290" rx="16" fill="url(#bg)"/>
  <rect width="900" height="290" rx="16" fill="url(#dots)"/>

  <!-- title -->
  <text x="40" y="52" font-family="Courier New, monospace" font-size="13" fill="#4cc9f0" letter-spacing="5">SPAM · HAM · CLASSIFIER</text>
  <text x="40" y="100" font-family="Courier New, monospace" font-size="38" font-weight="bold" fill="#ffffff">Message Intelligence</text>
  <text x="40" y="140" font-family="Courier New, monospace" font-size="38" font-weight="bold" fill="#ffffff">System</text>
  <text x="40" y="170" font-family="Courier New, monospace" font-size="15" fill="#9fb3c8">Every message gets inspected. Spam or Ham?</text>

  <!-- conveyor belt -->
  <rect x="30" y="224" width="540" height="16" rx="8" fill="#415a77"/>
  <g stroke="#778da9" stroke-width="2">
    <line x1="60" y1="224" x2="60" y2="240"/>
    <line x1="120" y1="224" x2="120" y2="240"/>
    <line x1="180" y1="224" x2="180" y2="240"/>
    <line x1="240" y1="224" x2="240" y2="240"/>
    <line x1="300" y1="224" x2="300" y2="240"/>
    <line x1="360" y1="224" x2="360" y2="240"/>
    <line x1="420" y1="224" x2="420" y2="240"/>
    <line x1="480" y1="224" x2="480" y2="240"/>
    <line x1="540" y1="224" x2="540" y2="240"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="60 0" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <rect x="570" y="215" width="40" height="40" fill="#0d1b2a"/>

  <!-- scanner gate -->
  <rect x="470" y="150" width="8" height="90" fill="#4cc9f0" opacity="0.8"/>
  <rect x="470" y="150" width="8" height="90" fill="#4cc9f0">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="474" y="144" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#4cc9f0">SCAN</text>

  <!-- HAM bin -->
  <rect x="690" y="80" width="170" height="64" rx="10" fill="#1b4332" stroke="#52b788" stroke-width="3"/>
  <text x="775" y="118" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#95d5b2">HAM · 0</text>

  <!-- SPAM bin -->
  <rect x="690" y="190" width="170" height="64" rx="10" fill="#6a040f" stroke="#e5383b" stroke-width="3"/>
  <text x="775" y="228" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#ffb3b8">SPAM · 1</text>

  <!-- ham envelope -->
  <g>
    <animateMotion path="M0,0 L440,0 L610,-100 L650,-100" dur="6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    <g transform="translate(60 215)">
      <rect x="-18" y="-12" width="36" height="24" rx="3" fill="#d8f3dc" stroke="#52b788" stroke-width="2"/>
      <polyline points="-18,-12 0,2 18,-12" fill="none" stroke="#52b788" stroke-width="2"/>
    </g>
  </g>

  <!-- spam envelope -->
  <g>
    <animateMotion path="M0,0 L440,0 L610,0 L650,0" dur="6s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    <g transform="translate(60 215)">
      <rect x="-18" y="-12" width="36" height="24" rx="3" fill="#ffe5e7" stroke="#e5383b" stroke-width="2"/>
      <polyline points="-18,-12 0,2 18,-12" fill="none" stroke="#e5383b" stroke-width="2"/>
      <text x="0" y="-16" text-anchor="middle" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#e5383b">!</text>
    </g>
  </g>
</svg>
